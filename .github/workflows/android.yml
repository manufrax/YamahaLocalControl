
name: Build Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Yamaha Local Control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          echo "Searching for Gradle settings files..."
          find . -maxdepth 5 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print

      - name: Build debug APK
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -maxdepth 5 -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts file found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project directory: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YamahaLocalControl-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          retention-days: 7
